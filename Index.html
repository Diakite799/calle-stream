<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>CALLE STREAM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#1c1c1c;border-bottom:2px solid #e22}
h1{margin:0;font-size:25px}
header p{color:#bbb;margin:7px 0 0}
main{max-width:720px;margin:auto;padding:16px}
.panel{background:#202020;border:1px solid #333;border-radius:14px;padding:15px;margin-bottom:16px}
h2{font-size:18px}
input{width:100%;padding:13px;background:#111;color:white;border:1px solid #555;border-radius:8px;font-size:15px}
button{border:0;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}
.red{background:#e22;color:white}
.gray{background:#393939;color:white}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1}
#player{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
#player iframe{width:100%;height:100%}
#status,.hint{font-size:13px;color:#bbb;line-height:1.5}
.item{display:flex;align-items:center;gap:8px;border-bottom:1px solid #444;padding:12px 0}
.item:last-child{border:0}
.item span{flex:1;overflow-wrap:anywhere;font-size:14px}
.item button{padding:9px}
</style>
</head>
<body>
<header>
<h1>▶ CALLE STREAM</h1>
<p>Ton espace vidéo personnel</p>
</header>
<main>
<section class="panel">
<h2>Ajouter une vidéo</h2>
<input id="url" placeholder="Colle un lien YouTube">
<div class="actions"><button class="red" id="add">+ Ajouter à la file</button></div>
<p class="hint">Ajoute les vidéos que tu souhaites regarder dans l'ordre de ton choix.</p>
</section>

<section class="panel">
<h2 id="title">Lecteur vidéo</h2>
<div id="player"></div>
<div class="actions">
<button class="red" id="play">▶ Lire</button>
<button class="gray" id="pause">Ⅱ Pause</button>
<button class="gray" id="next">Suivante ⏭</button>
</div>
<p id="status">Ajoute une vidéo pour commencer.</p>
</section>

<section class="panel">
<h2>Ma file (<span id="count">0</span>)</h2>
<div id="list"></div>
<button class="gray" id="clear">Vider la file</button>
</section>
</main>

<script>
let queue=[];
try{queue=JSON.parse(localStorage.getItem("calle-stream-queue")||"[]")}catch(e){}
let current=-1,player=null,ready=false;
const $=id=>document.getElementById(id);

function getId(s){
 try{
  let u=new URL(s.trim()),h=u.hostname.toLowerCase();
  if(h==="youtu.be")return u.pathname.split("/").filter(Boolean)[0]||null;
  if(h==="youtube.com"||h.endsWith(".youtube.com")){
   if(u.searchParams.get("v"))return u.searchParams.get("v");
   let p=u.pathname.split("/").filter(Boolean);
   if(["embed","shorts","live"].includes(p[0]))return p[1]||null;
  }
 }catch(e){}
 return null;
}
function save(){localStorage.setItem("calle-stream-queue",JSON.stringify(queue))}
function render(){
 $("count").textContent=queue.length;
 $("list").innerHTML="";
 if(!queue.length){$("list").textContent="Ta file est vide.";return}
 queue.forEach((v,i)=>{
  let row=document.createElement("div");row.className="item";
  let name=document.createElement("span");
  name.textContent=(i===current?"▶ ":"")+ (i+1)+". "+v.id;
  let play=document.createElement("button");play.className="gray";play.textContent="Lire";
  play.onclick=()=>start(i);
  let del=document.createElement("button");del.className="gray";del.textContent="Retirer";
  del.onclick=()=>{queue.splice(i,1);if(current===i)current=-1;else if(current>i)current--;save();render()};
  row.append(name,play,del);$("list").append(row);
 });
}
function start(i){
 if(i<0||i>=queue.length)return;
 current=i;render();$("title").textContent="Vidéo "+(i+1)+" / "+queue.length;
 if(!ready){$("status").textContent="Le lecteur charge. Réessaie dans un instant.";return}
 player.loadVideoById(queue[i].id);
 $("status").textContent="Vidéo sélectionnée.";
}
function next(){
 if(current+1<queue.length)start(current+1);
 else $("status").textContent="Fin de la file de lecture.";
}
$("add").onclick=()=>{
 let id=getId($("url").value);
 if(!id){$("status").textContent="Lien YouTube non reconnu.";return}
 queue.push({id});save();render();$("url").value="";
 $("status").textContent="Vidéo ajoutée.";
};
$("play").onclick=()=>{if(current<0&&queue.length)start(0);else if(ready)player.playVideo()};
$("pause").onclick=()=>{if(ready)player.pauseVideo()};
$("next").onclick=next;
$("clear").onclick=()=>{
 if(!confirm("Vider la file ?"))return;
 queue=[];current=-1;save();render();
 if(ready)player.stopVideo();
 $("status").textContent="File vidée.";
};
function onYouTubeIframeAPIReady(){
 player=new YT.Player("player",{
  width:"100%",height:"100%",videoId:"",
  playerVars:{playsinline:1},
  events:{
   onReady:()=>{ready=true;$("status").textContent="Lecteur prêt."},
   onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)next()},
   onError:()=>{$("status").textContent="Impossible de lire cette vidéo intégrée. Essaie une autre vidéo."}
  }
 });
}
render();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
